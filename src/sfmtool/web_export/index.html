<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reconstruction view</title>
<style>
html,body{height:100%;margin:0;background:#17191e}
#scene{width:100%;height:100%;border-radius:0}
.wx-error{color:#fff;font:14px system-ui,sans-serif;padding:16px}
</style>
</head>
<body>
<div id="scene"></div>
<!-- wx-inline -->
<script type="module">
// Options come from the query string, so an iframe can choose them:
// ?patches=0&points=0&cameras=0&start=<image name>&bg=<css colour>&stats=1
const q = new URLSearchParams(location.search);
const off = (key) => q.get(key) === "0" || q.get(key) === "false";
const opts = {
  startActive: true,
  fillsPage: true,
  showPatches: !off("patches"),
  showPoints: !off("points"),
  showCameras: !off("cameras"),
  startImage: q.get("start") || undefined,
  background: q.get("bg") || undefined,
  showStats: q.get("stats") === "1",
};
const el = document.getElementById("scene");
try {
  // A single-file export carries the scene and the viewer inline.
  const inlineScene = document.getElementById("wx-scene");
  const inlineModule = document.getElementById("wx-module");
  const scene = inlineScene ? JSON.parse(inlineScene.textContent) : "scene.json";
  const { mount } = inlineModule
    ? await import(URL.createObjectURL(new Blob([inlineModule.textContent], { type: "text/javascript" })))
    : await import("./web-export.js");
  const view = await mount(el, scene, opts);
  const source = view.scene.source;
  if (source && source.name) document.title = source.name;
} catch (e) {
  const p = document.createElement("p");
  p.className = "wx-error";
  p.textContent = `The view could not be drawn: ${e.message || e}`;
  el.appendChild(p);
}
</script>
</body>
</html>

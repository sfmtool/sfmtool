[package]
name = "sfmtool-py"
version = "0.4.1"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Python bindings for sfmtool core functionality"

[lib]
name = "_sfmtool"
crate-type = ["cdylib"]
# No Rust tests live in this crate (its surface is exercised via pytest through
# the built extension), and an `extension-module` crate's test harness cannot
# link anyway: the harness is an executable, but pyo3 deliberately leaves the
# Python C-API symbols undefined for extension modules (they resolve at import
# time). With `multiple-pymethods`, inventory's link-time constructors pull
# those symbols into any test binary unconditionally, so `cargo test` would
# fail at link. Disable the harness outright.
test = false
doctest = false

[dependencies]
sfmtool-core = { path = "../sfmtool-core" }
sfmtool-sift-format = { path = "../sfmtool-sift-format" }
sfmtool-sfmr-format = { path = "../sfmtool-sfmr-format" }
sfmtool-colmap = { path = "../sfmtool-colmap" }
sfmtool-matches-format = { path = "../sfmtool-matches-format" }
sfmtool-camrig-format = { path = "../sfmtool-camrig-format" }
pyo3 = { version = "0.30", features = ["extension-module", "multiple-pymethods"] }
rayon = "1.12"
image = "0.25"
numpy = { version = "0.30", features = ["half"] }
half = "2"
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.35"
# The viewer, which `run_explorer` runs and `sfm explorer` reaches through it.
# Default features, so the `mcp` feature is on and `sfm explorer --mcp` works
# from a wheel.
sfm-explorer = { path = "../sfm-explorer" }
openjd-expr = "0.13.0"
# The extension's global allocator (`lib.rs`; `specs/python-bindings.md` §
# "The global allocator"). It compiles mimalloc's C sources with the `cc`
# crate, as `zstd-sys` and `libsqlite3-sys` already compile theirs.
# `local_dynamic_tls` because Python loads the extension with `dlopen`: built
# with mimalloc's default initial-exec thread-local storage, the import fails
# on Linux with "cannot allocate memory in static TLS block".
mimalloc = { version = "0.1.52", features = ["local_dynamic_tls"] }

# Rustdoc lints are denied workspace-wide (see the root Cargo.toml).
[lints]
workspace = true

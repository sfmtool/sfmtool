[package]
name = "sfmtool-archive-io"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Shared ZIP + zstd container I/O for sfmtool's archive-based file formats"

[dependencies]
bytemuck = "1.25"
zip = { version = "8", default-features = false, features = ["deflate"] }
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"

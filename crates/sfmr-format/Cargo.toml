[package]
name = "sfmr-format"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Read/write .sfmr file format for SfM reconstructions"

[dependencies]
sfmtool-archive-io = { path = "../sfmtool-archive-io" }
ndarray = "0.17"
bytemuck = { version = "1.25", features = ["derive"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
nalgebra = "0.35"
dunce = "1"

[dev-dependencies]
approx = "0.5"
# Only the round-trip tests reach for the compressor directly; the library
# goes through `sfmtool-archive-io`.
zstd = "0.13"

# Rustdoc lints are denied workspace-wide (see the root Cargo.toml).
[lints]
workspace = true

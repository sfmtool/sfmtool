[package]
name = "sfmtool-kdf-format"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Persistent chunked randomized kd-forest format for sfmtool"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sfmtool-archive-io = { path = "../sfmtool-archive-io" }
sift-format = { path = "../sift-format" }
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

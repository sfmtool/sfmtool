[package]
name = "sfm-explorer"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "GUI application for viewing SfM reconstructions"

[lib]
name = "sfm_explorer"
path = "src/lib.rs"

[[bin]]
name = "sfm-explorer"
path = "src/main.rs"

[[example]]
name = "win32_directmanipulation"
path = "examples/win32_directmanipulation.rs"
required-features = ["directmanipulation"]

[[example]]
name = "winit_directmanipulation"
path = "examples/winit_directmanipulation.rs"
required-features = ["directmanipulation"]

[[example]]
name = "winit_wgpu_directmanipulation"
path = "examples/winit_wgpu_directmanipulation.rs"
required-features = ["directmanipulation"]

# The windowed accessibility suite. Declared explicitly rather than left to
# autodiscovery because `required-features` only applies to a target the
# manifest names, and the point of the gate is that a plain
# `cargo test --workspace` builds and runs everything *but* this: it needs a
# real window, a live accessibility stack and `--test-threads=1`, so it has its
# own CI jobs (`ui-test-{windows,macos,linux}`) and the `ui-test` pixi task,
# which pass `--features ui-tests`.
#
# Gating it also keeps the CI Rust step down to one `cargo test` invocation.
# The two it replaced -- `--workspace --exclude sfm-explorer` and
# `-p sfm-explorer --lib` -- resolve features differently over the
# wgpu/winit/accesskit subtree, so each dirtied the other's artifacts and the
# cached target dir accumulated both fingerprint variants. That thrash, not the
# code, was most of the second invocation's compile time.
[[test]]
name = "ui_basic"
path = "tests/ui_basic.rs"
required-features = ["ui-tests"]

[features]
default = ["mcp"]
directmanipulation = []
# Opt-in gate for the `ui_basic` target above. Carries no dependencies of its
# own: the suite's deps are unconditional dev-dependencies, and the feature
# exists purely so the target is off by default.
ui-tests = []

# The MCP control surface, and everything hosting an HTTP server in-process
# drags in: an async runtime, an HTTP stack, and the protocol SDK. Default-on so
# `--mcp` works in a stock build; `--no-default-features` drops the whole `mcp`
# module and its dependency tree, for anyone compiling the PyPI sdist on their
# own rustc who would rather not pay for it.
mcp = [
    "dep:rmcp",
    "dep:tokio",
    "dep:axum",
    "dep:serde",
    "dep:base64",
]

[dependencies]
sfmtool-core = { path = "../sfmtool-core" }
sfmtool-sift-format = { path = "../sfmtool-sift-format" }
sfmtool-matches-format = { path = "../sfmtool-matches-format" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui_dock = "0.21"
wgpu = { version = "30", features = ["dx12", "vulkan", "metal"] }
nalgebra = "0.35"
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
egui-winit = { version = "0.36", features = ["accesskit"] }
raw-window-handle = "0.6"
winit = "0.30.13"
pollster = "1"
rfd = "0.17"
rand = "0.10"
image = "0.25"
ndarray = "0.17"
# The SIFT index build reads a `.sift` file per image, which is an open and a
# zstd expand with nothing shared between two of them, so it reads them on the
# pool the forest build and the index write already use.
rayon = "1.12"
# The Action Log's timestamps and their local-time formatting. Over `chrono`
# for a smaller dependency graph, and over `time` because `time`'s local-offset
# lookup is unsound on Unix without an opt-in flag. Needs rustc 1.70, well
# under the workspace MSRV.
jiff = "0.2"
# The layout file. Read and written through `serde_json::Value` rather than a
# derive, because a `Deserialize` could not refuse an unknown key on an untagged
# node (see `specs/gui/panel-layout.md`). Not behind the `mcp` feature: Panels >
# Save/Load Layout is in every build.
serde_json = "1"

# ── The `mcp` feature's dependency tree (see [features] above) ──
#
# `rmcp` is pinned to an exact minor: it is here to absorb the protocol's
# revision history (2024-11-05 through 2026-07-28), so which revisions a given
# version negotiates is the reason it is a dependency at all, and a silent
# minor bump could change it. Moving the pin is therefore a deliberate step that
# re-checks `ProtocolVersion::KNOWN_VERSIONS` and `LATEST`: 3.2 -> 3.4 left both
# exactly as above, with `LATEST` still 2025-11-25, so what a client negotiates
# is unchanged.
rmcp = { version = "~3.4", optional = true, default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
# `rt` + `net` + `time` is a current-thread runtime with a TCP listener and the
# apply timeout; `sync` is the command channel and its per-request oneshot.
tokio = { version = "1", optional = true, default-features = false, features = [
    "rt",
    "net",
    "sync",
    "time",
] }
axum = { version = "0.8", optional = true, default-features = false, features = [
    "http1",
    "tokio",
] }
serde = { version = "1", optional = true, features = ["derive"] }
# Screenshots cross the wire as base64 in an MCP `ImageContent` block. Default
# features, which since 0.23 include `simd-unsafe`, because `rmcp` pulls the same
# crate with defaults on — opting out here would not drop the SIMD engines from
# the build, only ask for a second feature set that unification discards.
base64 = { version = "0.23", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
# The `noop` backend gives the upload tests a real `wgpu::Device` with no GPU:
# wgpu-core still does its full validation (limits, texture extents, copy sizes,
# pipeline/shader checks) while wgpu-hal stubs out the actual driver calls. As a
# dev-dependency the feature is unified only into test builds, so the shipped
# binary is unaffected.
wgpu = { version = "30", features = ["noop"] }

# The save tests read the file back off disk and check what the writer put in
# it. The crate itself never reaches past `sfmtool-core`, which is why this is a
# dev-dependency rather than a dependency.
sfmtool-sfmr-format = { path = "../sfmtool-sfmr-format" }

# The descriptor-index tests write a workspace's worth of `.sift` files and a
# `.kdf` over them, and want the directory gone when the test ends.
tempfile = "3"

# UI tests drive the accessibility tree, which xa11y reads on all three desktop
# platforms: Windows (UI Automation), macOS (AXUIElement), Linux (AT-SPI2 over
# D-Bus). Linux is the one whose API has to be brought up rather than merely
# used: AT-SPI2 is a pair of D-Bus services, so a headless box needs a display,
# a session bus and those daemons started before there is any tree to read, and
# a missing piece reads as an empty tree rather than an error.
# `scripts/a11y_env.sh` stands that up locally; `xa11y/setup-a11y` does it in
# CI. Not target-gated: `ui_basic` is `cfg`'d to those three targets, so a
# fourth compiles it away and never reaches this dependency.
xa11y = "0.15"
# `ui_basic`'s MCP screenshot tests speak the wire to a real viewer and decode
# the PNG a real frame produced. An integration test sees only dev-dependencies,
# so the three the crate already builds with are named again here.
base64 = "0.23"
image = "0.25"
serde_json = "1"

# Rustdoc lints are denied workspace-wide (see the root Cargo.toml).
[lints]
workspace = true

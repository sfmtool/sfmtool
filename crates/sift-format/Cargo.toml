[package]
name = "sift-format"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Read/write .sift file format for SIFT feature descriptors"

[dependencies]
sfmtool-archive-io = { path = "../sfmtool-archive-io" }
ndarray = "0.17"
bytemuck = { version = "1.25", features = ["derive"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"

[dev-dependencies]
approx = "0.5"

# Rustdoc lints are denied workspace-wide (see the root Cargo.toml).
[lints]
workspace = true

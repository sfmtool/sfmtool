[package]
name = "sfmtool-core"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Core data structures and algorithms for sfmtool"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
base64 = "0.23"
half = "2"
# Photograph decoding (display thumbnails, display patch bitmaps) and the JPEG
# atlas pages `web_export` writes.
image = "0.25"
# JPEG encoding for `ImageU8::write`: with 4:2:0 chroma subsampling a JPEG
# matches the size of OpenCV's at the same quality, and one thread writes it at
# about half OpenCV's speed; the `image` crate's own encoder (4:4:4 only) writes
# files 14% larger at a quarter of OpenCV's speed. Licensed
# "(MIT OR Apache-2.0) AND IJG"; the IJG credit is in THIRD-PARTY-NOTICES.md.
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
# JPEG decoding for `ImageU8::read_rgb` / `read_rgba`. The `image` crate's JPEG
# decoder, zune-jpeg 0.5.15, returns wrong pixels without an error for a
# baseline JPEG that stores each component in a scan of its own; this crate
# decodes those as OpenCV does, at the same speed. A JPEG that ends before its
# end-of-image marker is still decoded by zune-jpeg, since this crate does not
# fill the missing part with grey as libjpeg does, unless it has a scan of
# fewer components than its frame (see `decode_jpeg`). It is in maintenance mode:
# its README says image-rs is moving to zune-jpeg, and its last release is
# 0.3.2 (2025-06). Switch back to the `image` crate's decoder once a stable
# zune-jpeg release passes `read_decodes_a_jpeg_with_one_scan_per_component`.
# Default features off, so it does not use rayon (the photograph cache decodes
# inside a `OnceLock` and must not); it is still not single-threaded, since for
# an image wider than 128 px it starts one OS thread per colour component. The
# `rayon` feature measured 3% faster on one image.
jpeg-decoder = { version = "0.3.2", default-features = false }
nalgebra = "0.35"
ndarray = "0.17"
# Build-once / query-many KD-tree for the spatial index (`spatial.rs`). Default
# features off: `fixed` adds fixed-point axis types this codebase has no use
# for, and only `multi-threaded` (parallel bulk construction, via the rayon
# already in this tree) is worth keeping.
kiddo = { version = "6", default-features = false, features = ["multi-threaded"] }
rayon = "1.12"
pathdiff = "0.2"
rand = "0.10"
rand_distr = "0.6"
serde_json = "1"
sfmtool-sfmr-format = { path = "../sfmtool-sfmr-format" }
sfmtool-archive-io = { path = "../sfmtool-archive-io" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sfmtool-sift-format = { path = "../sfmtool-sift-format" }
sfmtool-camrig-format = { path = "../sfmtool-camrig-format" }
sfmtool-matches-format = { path = "../sfmtool-matches-format" }
sfmtool-kdf-format = { path = "../sfmtool-kdf-format" }
sfmtool-progress = { path = "../sfmtool-progress" }

# GPU compute (optional)
wgpu = { version = "30", features = ["dx12", "vulkan"], optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }

# Physical memory size, for the photograph cache's default budget
# (`camera::photograph_cache::default_budget_bytes`). Both are already in the
# lockfile through other crates of the workspace.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }
# Used by the .sfmr v4→v5 upgrade-on-load tests to author version-4 fixture
# bytes (rewriting the archive's metadata.json.zst version field).
zip = { version = "8", default-features = false, features = ["deflate"] }
zstd = "0.14"
tempfile = "3"

[[bench]]
name = "optical_flow"
harness = false

[[bench]]
name = "kdtree_forest"
harness = false

[[bench]]
name = "patch_render"
harness = false

# Rustdoc lints are denied workspace-wide (see the root Cargo.toml).
[lints]
workspace = true

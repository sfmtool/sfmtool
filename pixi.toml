[workspace]
authors = ["Mark <399551+mwiebe@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "sfmtool"
# The bare subdirs are the CUDA-free platforms every normal environment uses.
# The `*-cuda` named platforms attach the `__cuda` virtual package (Pixi's
# rich-platform replacement for the deprecated `[system-requirements]` table)
# and are opted into only by the `cuda` feature/environment. Non-CUDA
# environments pin the bare subdirs via the `cpu` feature so the named CUDA
# platforms never leak a `cuda*` pycolmap build into them.
platforms = [
    "win-64",
    "linux-64",
    "osx-arm64",
    { name = "win-64-cuda", platform = "win-64", cuda = "12.9" },
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12.9" },
]
version = "0.2"

# Universal build dependency: the Rust toolchain is needed to build any crate in
# the workspace (clippy, the sfm-explorer GUI tests, the PyO3 extension).
[dependencies]
rust = ">=1.98.0,<1.99"

# The SfM runtime: the Python interpreter and the pycolmap solver. Only
# environments that actually run the Python tool pull this in — keeping it out
# of the base deps lets the `lint` and `ui` environments skip the heavy
# pycolmap/Qt/CUDA/opencv closure.
[feature.runtime.dependencies]
python = ">=3.14.7,<3.15"
pycolmap = ">=4.1.1,<5"

# The editable sfmtool self-install compiles the PyO3 extension via maturin at
# `pixi install` time. It lives in its own feature so CI can build a runtime
# environment *without* it (`test-ci`) and compile the extension exactly once,
# explicitly, via `maturin develop --release` — instead of building it twice
# (once at install, once in the explicit step). Every local environment still
# includes it so imports work straight out of `pixi install`.
[feature.editable.pypi-dependencies]
sfmtool = { path = ".", editable = true }

[tasks]
gui = "cargo run --release -p sfm-explorer --bin sfm-explorer"
# The viewer with its MCP endpoint on the default port, so an agent can drive
# it: `pixi run gui-mcp scene.sfmr`. The `--` is spent here rather than by the
# caller because `cargo run` consumes the first one, and `pixi run gui -- --mcp`
# would hand `--mcp` to cargo instead of to the viewer.
# See `specs/gui/mcp-server.md`.
gui-mcp = "cargo run --release -p sfm-explorer --bin sfm-explorer -- --mcp"
ui-test = "cargo test -p sfm-explorer --test ui_basic -- --test-threads=1"
# Rustdoc gate. `--document-private-items` is deliberate: it is a strict superset
# of the plain build's diagnostics (it adds the links written inside private
# items, which is most of this workspace's cross-referencing) and it is the doc
# build anyone working on the crates actually reads. Warnings are errors via
# `[workspace.lints.rustdoc]` in Cargo.toml, so a plain `cargo doc` fails the
# same way this task does. The PyO3 build script needs a Python interpreter, so
# this must run in an environment that has one — `lint` and `test` both do.
doc = "cargo doc --workspace --no-deps --document-private-items"

# The same UI suite on Linux, wrapped in the accessibility stack it reads the
# viewer's tree through. Windows and macOS have theirs running as part of the
# desktop; on Linux AT-SPI2 is a set of D-Bus services that a headless box — a
# container, a CI runner, an SSH session — simply does not have, and a missing
# one shows up as an empty tree rather than an error. The wrapper starts only
# what the environment lacks, so on a real desktop (or under `xa11y/setup-a11y`
# in CI) it is a passthrough. Target-scoped tasks override the workspace-wide
# one of the same name, so `pixi run ui-test` is the command on all three
# platforms.
[target.linux-64.tasks]
ui-test = "bash scripts/a11y_env.sh cargo test -p sfm-explorer --test ui_basic -- --test-threads=1"

# Linting: ruff plus a Python interpreter. clippy doesn't link libpython, but the
# PyO3 build script for sfmtool-py needs an interpreter at compile time.
[feature.lint.dependencies]
python = ">=3.14.7,<3.15"

[feature.lint.pypi-dependencies]
ruff = ">=0.16.6, <0.17"

# Task tables live in their own features, separate from the dependencies they
# use, and each such feature belongs to EXACTLY ONE environment. `pixi run
# <task>` resolves a task by finding the environments that provide it: if that
# is one environment, or if `default` is among them, it runs; if two or more
# provide it and `default` does not, it refuses as ambiguous. The `lint` deps
# below are shared by `lint`, `test` and `test-ci` — so binding these two task
# names to the same feature would make `pixi run fmt` ambiguous three ways.
# Keep tasks and the deps they need in separate features whenever more than one
# environment wants the deps.
[feature.lint-tasks.tasks]
fmt = "ruff format src tests"
check = "ruff check src tests"

# xa11y's Linux backend links libxkbcommon (its Wayland input path), and on
# Linux the linker is the conda toolchain out of the environment, which searches
# its own prefix and sysroot rather than /usr/lib. An apt `libxkbcommon-dev` is
# invisible to it, so `cargo test -p sfm-explorer --test ui_basic` fails at link
# with `unable to find library -lxkbcommon` however complete the system is —
# and putting /usr/lib on the linker's search path is not the fix, because it
# then takes the system glibc's startup objects too and fails on the
# `__libc_csu_init` that glibc dropped in 2.34.
#
# `ui` is the one environment that builds that target on Linux and the one
# stripped down enough to lack the library; every other Linux environment
# already pulls it in transitively through pycolmap's Qt stack.
[feature.ui-linux.target.linux-64.dependencies]
libxkbcommon = ">=1.13.2,<2"

[feature.test.dependencies]
cargo-llvm-cov = ">=0.9.0,<0.10"

[feature.test.pypi-dependencies]
maturin = ">=1.15.0, <2"
pip = ">=26.2.1, <27"
pytest = ">=9.1.1, <10"
pytest-cov = ">=7.1.0, <8"
# Parallel test execution. The suite is dominated by a handful of long
# reconstruction/patch tests; spreading them across workers is the main lever
# on the instrumented Linux coverage job. Worker count is capped at min(4, cpu)
# in CI (see scripts/coverage.sh); pytest-cov auto-combines per-worker data.
pytest-xdist = ">=3.8.0, <4"

[feature.test.activation.env]
# Force UTF-8 stdio on Windows so histogram block characters (▁..█) and other
# non-ASCII output survive cp1252. Matters under pytest's tee-sys capture
# (which routes prints through Python's text streams) and applies to any
# test-env command — `pixi run test`, `pixi run coverage-all`, the coverage
# shell script, etc.
PYTHONIOENCODING = "utf-8"

# Bound to the `test` environment only, so the bare `pixi run test` works — see
# the note on `[feature.lint-tasks.tasks]`. `test-ci` shares every dependency
# these need but not the task names, and calls the underlying commands directly
# (`pixi run -e test-ci pytest …`, `… maturin develop --release`); a task name
# it also carried would put `test` and `test-ci` back in conflict.
[feature.test-tasks.tasks]
test = "pytest -n auto"
test-rust = "cargo llvm-cov --workspace --exclude sfmtool-py --exclude sfm-explorer"
coverage = "cargo llvm-cov --workspace --lcov --output-path lcov.info"
coverage-all = "bash scripts/coverage.sh"
coverage-html = "cargo llvm-cov --workspace --html --open"
maturin = "maturin"
bench-sift = "python scripts/benchmark_sift.py"

[feature.dev.tasks]
ipython = "ipython"

[feature.docs.pypi-dependencies]
zensical = ">=0.0.59, <0.0.60"

[feature.docs.tasks]
docs-serve = "zensical serve"
docs-build = "zensical build"

# Pins every non-CUDA environment to the bare CUDA-free subdirs. A feature's
# `platforms` can only name workspace platforms (not inline rich tables), so the
# `__cuda` virtual package has to live on named workspace platforms; without
# this pin the unrestricted features would inherit those named platforms and
# Pixi would resolve the CUDA pycolmap build for `default`, `test`, etc.
[feature.cpu]
platforms = ["win-64", "linux-64", "osx-arm64"]

# CUDA-enabled pycolmap is only published for Linux and Windows, so restrict the
# cuda feature (and any environment that uses it) to the `*-cuda` named
# platforms — otherwise the lock solve fails for osx-arm64, which has no CUDA
# builds. Those named platforms also carry the `__cuda` virtual package the
# `cuda*` builds require (the rich-platform replacement for the deprecated
# `[feature.cuda.system-requirements]` table).
[feature.cuda]
platforms = ["win-64-cuda", "linux-64-cuda"]

[feature.cuda.dependencies]
pycolmap = { version = ">=4.2.0,<5", build = "cuda*" }

[environments]
default = { features = ["runtime", "editable", "cpu"], solve-group = "default" }
lint = { features = ["lint", "lint-tasks", "cpu"], solve-group = "default" }
ui = { features = ["ui-linux", "cpu"], solve-group = "default" }
test = { features = ["runtime", "editable", "lint", "test", "test-tasks", "cpu"], solve-group = "default" }
# Same packages as `test` but without the editable self-install, so `pixi
# install` does no Rust build. CI installs this and compiles the extension
# explicitly with `maturin develop --release` (test-os) / coverage.sh (test-linux).
test-ci = { features = ["runtime", "lint", "test", "cpu"], solve-group = "default" }
dev = { features = ["runtime", "editable", "dev", "cpu"], solve-group = "default" }
docs = { features = ["runtime", "editable", "docs", "cpu"], solve-group = "default" }
cuda = { features = ["runtime", "editable", "cuda"], solve-group = "cuda" }

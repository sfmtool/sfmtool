[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "sfmtool"
version = "0.3"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Structure from Motion toolkit built on COLMAP: a CLI, file formats and a 3D viewer"
readme = "README.md"
authors = [{ name = "Mark Wiebe" }]
keywords = [
    "structure-from-motion",
    "sfm",
    "photogrammetry",
    "colmap",
    "3d-reconstruction",
    "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# Lower bounds are the versions CI runs against where an older release is known
# to lack something sfmtool uses: pycolmap's API changes between major
# versions, and `deadline` 0.60.7 is the release whose pinned
# deadline-job-attachments provides `deadline.job_attachments.api`.
dependencies = [
    "click>=8",
    "deadline>=0.60.7",
    "numpy>=2",
    "opencv-python-headless",
    "pycolmap>=4.1.1,<5",
    "xxhash>=3.4",
]

[project.urls]
Homepage = "https://github.com/sfmtool/sfmtool"
Documentation = "https://sfmtool.github.io/sfmtool/"
Repository = "https://github.com/sfmtool/sfmtool"
Issues = "https://github.com/sfmtool/sfmtool/issues"

[project.scripts]
sfm = "sfmtool.cli:main"

[dependency-groups]
test = ["pytest", "ruff"]
dev = ["ipython", {include-group = "test"}]

[tool.maturin]
manifest-path = "crates/sfmtool-py/Cargo.toml"
python-source = "src"
module-name = "sfmtool._sfmtool"

[tool.ruff.lint]
# The project had no ruff config and so inherited ruff's default rule set. Ruff
# 0.16 broadened that default considerably (isort, flake8-bugbear,
# flake8-simplify, RUF, …), which would have changed lint policy purely as a
# side effect of a version bump. Pin the selection to the rules the codebase has
# always been linted against; widening it is a deliberate, separate change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tee-sys avoids fd-level dup that breaks Click CliRunner on Windows + Python 3.14
# (pytest's default FDCapture corrupts Click's preserved fileno; see pytest #2465 / #13720).
# --durations surfaces the slowest tests/fixtures (setup/call/teardown) at the
# end of every run, including in CI, to keep an eye on suite hot spots.
addopts = "--capture=tee-sys --durations=15"

[tool.coverage.run]
# parallel + multiprocessing tracks code that runs inside ProcessPoolExecutor
# workers (e.g. merge.pose_refinement._refine_single_camera_pose). pytest-cov
# auto-instruments the spawned interpreters from this config alone — no
# COVERAGE_PROCESS_START env var needed (and setting it triggers a numpy
# multi-init crash on Python 3.14).
parallel = true
concurrency = ["multiprocessing"]
source = ["sfmtool"]

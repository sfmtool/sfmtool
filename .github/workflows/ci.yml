name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Incremental compilation only pays off across edit/rebuild cycles on a warm
  # tree; in CI each job compiles roughly once, so the large target/**/incremental
  # dirs are pure overhead that bloat the Rust cache (and slow its save/restore,
  # painfully so on Windows). Disable it everywhere and drop those dirs from the
  # cache below.
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'crates/**'
              - 'tests/**'
              - 'test-data/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - 'pixi.toml'
              - 'pixi.lock'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh cache delete` in the prune step, which runs on main only.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: lint
          # No env cache: restoring one costs more than building it. Measured
          # over 11 runs, `pixi install --locked` beat a cache restore for every
          # environment but Windows `test-ci` -- here 5s to install against 6s
          # to restore, because pixi links packages from the conda-forge CDN
          # faster than the cache service ships the installed tree back. The
          # seven env caches also held 5.5 GB of the repo's 10 GB budget to save
          # ~35s a run at best, and the LRU eviction that caused was evicting
          # the Rust target caches, which are worth ~15 min a run. See the
          # test-os-rust job for the one environment that pays.
          cache: false
      - name: Restore cargo home
        id: home-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          # Registry index + downloads and git checkouts are fully determined by
          # Cargo.lock, so key on it alone. Restore-only: the one job per OS that
          # fetches every crate saves it, and the prefix fallback is for pull
          # requests only. See "Rust caches" above prune-caches.
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-home-', runner.os) || '' }}
      - name: Restore Rust target
        id: target-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target
            !target/**/incremental/**
          # Content-addressed on the lockfile *and* the manifests -- see "Rust
          # caches" above prune-caches for why the manifests belong in it. It
          # hits outright whenever neither has moved, and the Save step below
          # then leaves the existing entry alone. The prefix fallback warms a
          # pull request whose key has moved; main does without it, so each
          # generation it saves holds only what that key builds.
          key: ${{ runner.os }}-cargo-lint-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-lint-target-', runner.os) || '' }}

      - name: Ruff format
        run: pixi run -e lint ruff format --check src tests

      - name: Ruff lint
        run: pixi run -e lint check

      - name: Cargo fmt
        run: pixi run -e lint cargo fmt --all -- --check

      # `--features sfm-explorer/ui-tests` is load-bearing, not tidiness.
      # `ui_basic` is a `required-features` target (see sfm-explorer's
      # Cargo.toml), and cargo *silently skips* such a target when the feature
      # is off -- so without this flag `--all-targets` would quietly stop
      # checking 1300+ lines of test code and report success. This job is the
      # only place `ui_basic` is compiled on Linux, which is what lets a broken
      # ui test fail fast here rather than only in the windowed ui-test jobs.
      #
      # Not `--all-features`: that would also turn on `directmanipulation`,
      # whose examples are Windows-only and do not compile here.
      - name: Cargo clippy
        run: pixi run -e lint cargo clippy --workspace --all-targets --features sfm-explorer/ui-tests -- -D warnings

      # Rustdoc warnings are denied by `[workspace.lints.rustdoc]` in Cargo.toml,
      # so this fails on a broken doc link with no extra flags here. The `lint`
      # environment carries a Python interpreter for the same reason clippy needs
      # one: sfmtool-py's PyO3 build script.
      - name: Cargo doc
        run: pixi run -e lint doc

      - name: Save Rust target
        # Main only, and only a new generation (the cache-hit guard): a PR's
        # entry is scoped to its merge ref, where nothing else can restore it.
        # The key is the one the restore step computed, not a fresh
        # hashFiles, so what is saved is always what was asked for.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            target
            !target/**/incremental/**
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

      - name: Save cargo home
        # This job fetches every crate the workspace needs on this OS, so it
        # is the one that saves the shared cargo home. Success only, as the
        # old combined actions/cache did: a half-fetched registry saved under
        # the exact key would be restored as-is for the whole generation.
        if: ${{ github.ref == 'refs/heads/main' && steps.home-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.home-cache.outputs.cache-primary-key }}

      - name: Prune superseded Rust caches
        # Delete the previous generation of what this job just saved, now,
        # rather than when the slowest job finishes. See "Rust caches".
        #
        # Two invocations, because this job saves both a target dir and a cargo
        # home and the two are keyed on different generations. Passing the
        # target hash for the cargo-home prefix would find no entry at it and
        # silently prune nothing, letting the homes accumulate. Each key
        # supplies its own hash, taken from the key the restore step computed.
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEY: ${{ steps.target-cache.outputs.cache-primary-key }}
          HOME_KEY: ${{ steps.home-cache.outputs.cache-primary-key }}
        run: |
          bash scripts/ci_prune_caches.sh "${KEY##*-}" "${KEY%-*}"
          bash scripts/ci_prune_caches.sh "${HOME_KEY##*-}" "${HOME_KEY%-*}"

  # Builds the workspace with the *minimum* supported Rust, which is deliberately
  # older than the toolchain pixi.toml pins for development. The consumer is the
  # PyPI sdist: we publish wheels for Linux and Windows only, so anyone else --
  # macOS users in particular -- compiles this whole workspace with whatever rustc
  # they already have. Without this job an MSRV regression is invisible until it
  # reaches them as a confusing mid-compile error.
  #
  # Dependencies routinely raise the floor without declaring it (libsqlite3-sys
  # 0.38.1 forced 1.95 via `cfg_select!` while declaring no rust-version at all),
  # so metadata inspection is not a substitute for an actual build.
  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only the pixi binary is needed; `pixi exec` builds the throwaway MSRV
      # environment. Installing a project environment would just pull the 1.98
      # toolchain this job exists to avoid.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false
      - name: Restore cargo home
        id: home-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          # Registry index + downloads and git checkouts are fully determined by
          # Cargo.lock, so key on it alone. Restore-only: the one job per OS that
          # fetches every crate saves it, and the prefix fallback is for pull
          # requests only. See "Rust caches" above prune-caches.
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-home-', runner.os) || '' }}

      # Single source of truth: the floor lives in [workspace.package] and is read
      # from there, so bumping the MSRV never means editing this workflow too.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"

      # Scoped to the default targets rather than --all-targets: the sdist builds
      # library code only, so holding benches and test-only dev-dependencies to the
      # same floor would fail this job for something no consumer ever compiles.
      # Python is pinned because the sfmtool-py build script needs an interpreter.
      - name: Cargo check at MSRV
        run: >
          pixi exec
          -s "rust==${{ steps.msrv.outputs.version }}.*"
          -s "python=3.14.*"
          -- cargo check --workspace --locked

  # Full instrumented build + combined Rust/Python coverage, uploaded to
  # codecov. Coverage line numbers are platform-independent, so we only pay
  # the slower instrumented build once, on Linux. Windows and macOS still run
  # the same tests (see test-os-rust and test-os-python) without instrumentation.
  test-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Let codecov authenticate via the GitHub OIDC token (use_oidc below)
      # instead of a stored CODECOV_TOKEN. Tokenless upload only works on
      # pull_request events, so push-to-main coverage was failing to upload.
      id-token: write
      # `gh cache delete` in the prune step, which runs on main only.
      actions: write
    steps:
      - uses: actions/checkout@v7
      # The `test-ci` env install does no Rust build (unlike `test`, it omits the
      # editable sfmtool); coverage.sh compiles the extension once via
      # `maturin develop --release`. Restore the cache first so that build is
      # incremental instead of a cold ~6 min compile.
      - name: Restore cargo home
        id: home-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          # Registry index + downloads and git checkouts are fully determined by
          # Cargo.lock, so key on it alone. Restore-only: the one job per OS that
          # fetches every crate saves it, and the prefix fallback is for pull
          # requests only. See "Rust caches" above prune-caches.
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-home-', runner.os) || '' }}
      - name: Restore Rust target
        id: target-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target
            !target/**/incremental/**
          # Content-addressed on the lockfile *and* the manifests -- see "Rust
          # caches" above prune-caches for why the manifests belong in it. It
          # hits outright whenever neither has moved, and the Save step below
          # then leaves the existing entry alone. The prefix fallback warms a
          # pull request whose key has moved; main does without it, so each
          # generation it saves holds only what that key builds.
          key: ${{ runner.os }}-cargo-coverage-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-coverage-target-', runner.os) || '' }}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: test-ci
          # No env cache: installing test-ci here takes 19s and restoring it 21s,
          # for 1.7 GB of the shared cache budget. See the lint job.
          cache: false

      - name: Run tests with combined coverage
        shell: bash
        run: |
          # Sample system memory throughout the run. This is the only job that
          # runs the whole suite under load, so it's where we learn the peak
          # footprint + whether the box swaps — the data needed to decide how
          # many pytest-xdist workers the 16 GB / 4-core runner can take.
          echo "== runner resources =="
          nproc || true
          free -h || true
          bash scripts/ci_mem_sample.sh sample 2 mem-samples.tsv &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          set +e
          # The script, not the `coverage-all` task: that task is bound to the
          # `test` environment alone so the bare `pixi run coverage-all` stays
          # unambiguous locally (see the task-feature note in pixi.toml).
          # `test-ci` carries every dependency it needs, just not the name.
          pixi run -e test-ci bash scripts/coverage.sh
          rc=$?
          set -e
          kill "$sampler" 2>/dev/null || true
          trap - EXIT
          echo "== memory summary (whole coverage run) =="
          bash scripts/ci_mem_sample.sh summary mem-samples.tsv || true
          exit "$rc"

      - name: Upload memory samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-coverage-mem-samples
          path: mem-samples.tsv
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: lcov.info,python-lcov.info
          flags: ubuntu-latest

      - name: Save Rust target
        # Main only, and only a new generation (the cache-hit guard): a PR's
        # entry is scoped to its merge ref, where nothing else can restore it.
        # The key is the one the restore step computed, not a fresh
        # hashFiles, so what is saved is always what was asked for.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            target
            !target/**/incremental/**
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

      - name: Prune superseded Rust caches
        # Delete the previous generation of what this job just saved, now,
        # rather than when the slowest job finishes. See "Rust caches".
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEY: ${{ steps.target-cache.outputs.cache-primary-key }}
        run: bash scripts/ci_prune_caches.sh "${KEY##*-}" "${KEY%-*}"

  # Non-Linux correctness check: runs the same Rust + Python suites as the
  # coverage job, but without LLVM coverage instrumentation (much faster to
  # build) since coverage line numbers are platform-independent and Linux
  # already produces them. macos-latest runners are Apple Silicon (arm64),
  # matching the osx-arm64 pixi platform.
  #
  # Split in two because the halves need nothing from each other: the Rust
  # suite never loads the Python extension, and pytest never runs a Rust test
  # binary. Back to back they were the joint-slowest job in CI (~24 min on
  # Windows); side by side each half is about half that. They also build
  # disjoint trees -- `cargo test` fills target/debug, `maturin develop
  # --release` fills target/release -- so they cache under *different* prefixes
  # and neither clobbers the other.
  #
  # That reads like two extra cache entries but is close to none: the single
  # `<OS>-cargo-test-target` entry it replaces already held both trees (1322 MB
  # on Windows, 1156 MB on macOS), so the split mostly *divides* that between
  # two keys rather than adding a second copy. Dropping docs.yml's 1828 MB pixi
  # env cache in the same change leaves the budget clearly better off either
  # way. See "Rust caches" above prune-caches for the budget rules.
  test-os-rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # `gh cache delete` in the prune step, which runs on main only.
      actions: write
    steps:
      - uses: actions/checkout@v7
      # `test-ci` is used rather than `test` because the latter's editable
      # sfmtool install would compile the PyO3 extension this job has no use
      # for. Restore the cache first so the test build is incremental instead
      # of cold. The key is namespaced by runner.os, so each matrix OS keeps
      # its own cache.
      - name: Restore cargo home
        id: home-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          # Registry index + downloads and git checkouts are fully determined by
          # Cargo.lock, so key on it alone. Restore-only: the one job per OS that
          # fetches every crate saves it, and the prefix fallback is for pull
          # requests only. See "Rust caches" above prune-caches.
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-home-', runner.os) || '' }}
      - name: Restore Rust target
        id: target-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target
            !target/**/incremental/**
          # Content-addressed on the lockfile *and* the manifests -- see "Rust
          # caches" above prune-caches for why the manifests belong in it. It
          # hits outright whenever neither has moved, and the Save step below
          # then leaves the existing entry alone. The prefix fallback warms a
          # pull request whose key has moved; main does without it, so each
          # generation it saves holds only what that key builds.
          key: ${{ runner.os }}-cargo-test-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-test-target-', runner.os) || '' }}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: test-ci
          # No env cache, on either platform. Windows `test-ci` is the one
          # environment that is genuinely slower to install than to restore (70s
          # against 32s, measured over the 11 runs in #382), so it kept its cache
          # when the other five were dropped -- but 39s for 1.41 GB is 28 s/GB,
          # against the ~165 s/GB a Rust target cache returns. It was the least
          # valuable gigabyte still in the budget, and at 14% of the repo's 10 GB
          # it was displacing entries worth six times as much. macOS was already
          # `false` (24s to install, 20s to restore). See the lint job.
          cache: false

      # One invocation, covering every crate including sfm-explorer. It used to
      # be two -- `--workspace --exclude sfm-explorer` then `-p sfm-explorer
      # --lib` -- because sfm-explorer's `ui_basic` integration tests need a
      # window and `--test-threads=1`. That split cost far more than it looked
      # like it should: measured by touching sfmtool-core and running both in
      # sequence, the second invocation rebuilt wgpu, wgpu-hal, wgpu-core,
      # windows, accesskit_windows, accesskit_winit, gpu-allocator and the egui
      # integration crates -- none of which depend on sfmtool-core, and all of
      # which the first invocation had just left fresh. The two resolve features
      # differently over that subtree, so each dirtied the other's artifacts and
      # the cached target dir carried both fingerprint variants. `ui_basic` now
      # sits behind sfm-explorer's non-default `ui-tests` feature (see its
      # Cargo.toml), so a plain `cargo test --workspace` builds and runs
      # everything except it, once.
      #
      # The Linux coverage job still excludes sfm-explorer, for an unrelated
      # reason: adding an uninstrumented `cargo test` beside the instrumented
      # one would write non-instrumented artifacts into the same target dir
      # (cargo does not fingerprint llvm-cov's RUSTC_WRAPPER), silently
      # degrading the next run's coverage via the shared cache. So these jobs
      # are the only ones that *execute* sfm-explorer's lib tests. Linux still
      # *compiles* them, and `ui_basic` with them, through `clippy --workspace
      # --all-targets --features sfm-explorer/ui-tests -D warnings` in the lint
      # job, so a broken test still fails fast there.
      - name: Rust tests
        run: pixi run -e test-ci cargo test --workspace

      - name: Save Rust target
        # Main only, and only a new generation (the cache-hit guard): a PR's
        # entry is scoped to its merge ref, where nothing else can restore it.
        # The key is the one the restore step computed, not a fresh
        # hashFiles, so what is saved is always what was asked for.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            target
            !target/**/incremental/**
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

      - name: Save cargo home
        # `cargo test --workspace` fetches every crate the workspace needs on
        # this OS, so this half of the split is the one that saves the shared
        # cargo home -- test-os-python builds only what the extension needs.
        # Success only, as the old combined actions/cache did: a half-fetched
        # registry saved under the exact key would be restored as-is for the
        # whole generation.
        if: ${{ github.ref == 'refs/heads/main' && steps.home-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.home-cache.outputs.cache-primary-key }}

      - name: Prune superseded Rust caches
        # Delete the previous generation of what this job just saved, now,
        # rather than when the slowest job finishes. See "Rust caches".
        #
        # Two invocations, because this job saves both a target dir and a cargo
        # home and the two are keyed on different generations. Passing the
        # target hash for the cargo-home prefix would find no entry at it and
        # silently prune nothing, letting the homes accumulate. Each key
        # supplies its own hash, taken from the key the restore step computed.
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEY: ${{ steps.target-cache.outputs.cache-primary-key }}
          HOME_KEY: ${{ steps.home-cache.outputs.cache-primary-key }}
        run: |
          bash scripts/ci_prune_caches.sh "${KEY##*-}" "${KEY%-*}"
          bash scripts/ci_prune_caches.sh "${HOME_KEY##*-}" "${HOME_KEY%-*}"

  # The Python half of the non-Linux check: build the extension, run pytest.
  # See test-os-rust above for why the two are separate jobs.
  test-os-python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # `gh cache delete` in the prune step, which runs on main only.
      actions: write
    steps:
      - uses: actions/checkout@v7
      # The `test-ci` env install does no Rust build (unlike `test`, it omits the
      # editable sfmtool); the extension is compiled once by the explicit
      # `maturin develop --release` step below. Restore the cache first so that
      # build is incremental instead of a cold compile. The key is namespaced by
      # runner.os, so each matrix OS keeps its own cache.
      - name: Restore cargo home
        id: home-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          # Registry index + downloads and git checkouts are fully determined by
          # Cargo.lock, so key on it alone. Restore-only: the one job per OS that
          # fetches every crate saves it -- test-os-rust on this OS, not this
          # job, which fetches only what the extension needs. The prefix fallback
          # is for pull requests only. See "Rust caches" above prune-caches.
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-home-', runner.os) || '' }}
      - name: Restore Rust target
        id: target-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target
            !target/**/incremental/**
          # A prefix of its own, not test-os-rust's: that job fills target/debug
          # and this one target/release, so a shared key would have whichever
          # finished last overwrite the other's tree with a disjoint one, and
          # every run would start cold. Same `<prefix>-<single hash>` shape as
          # the rest, which is what ci_prune_caches.sh parses. See "Rust caches"
          # above prune-caches.
          key: ${{ runner.os }}-cargo-pyext-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-pyext-target-', runner.os) || '' }}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: test-ci
          # No env cache, on either platform. Windows `test-ci` is the one
          # environment that is genuinely slower to install than to restore (70s
          # against 32s, measured over the 11 runs in #382), so it kept its cache
          # when the other five were dropped -- but 39s for 1.41 GB is 28 s/GB,
          # against the ~165 s/GB a Rust target cache returns. It was the least
          # valuable gigabyte still in the budget, and at 14% of the repo's 10 GB
          # it was displacing entries worth six times as much. macOS was already
          # `false` (24s to install, 20s to restore). See the lint job.
          cache: false

      - name: Build Python extension
        # --release: the debug-built PyO3 extension runs the Rust SIFT/flow
        # kernels ~10-15x slower, which both inflates test time and makes any
        # timing comparison (e.g. sfmtool vs COLMAP) meaningless. Tests exercise
        # the same optimized build that ships.
        # -x runs the executable without resolving Pixi tasks: `maturin` is also
        # a task name, bound to the `test` environment so the bare
        # `pixi run maturin …` stays unambiguous locally (see pixi.toml). Without
        # -x, Pixi finds the name defined in another environment and refuses
        # rather than falling back to the binary that is right there on PATH.
        run: pixi run -x -e test-ci maturin develop --release

      - name: Python tests
        shell: bash
        run: |
          # Parallelize across min(4, cpu) xdist workers (portable cpu count via
          # the env's Python so it works on the Windows runner's bash too).
          workers=$(pixi run -e test-ci python -c 'import os; print(min(4, os.cpu_count() or 1))')
          pixi run -e test-ci pytest -n "$workers"

      - name: Save Rust target
        # Main only, and only a new generation (the cache-hit guard): a PR's
        # entry is scoped to its merge ref, where nothing else can restore it.
        # The key is the one the restore step computed, not a fresh
        # hashFiles, so what is saved is always what was asked for.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            target
            !target/**/incremental/**
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

      # No "Save cargo home" step here on purpose: this job compiles only the
      # extension's dependency subtree, so the registry it ends up with is a
      # subset of the workspace's. test-os-rust saves the shared cargo home for
      # this OS. See "Rust caches" above prune-caches.

      - name: Prune superseded Rust caches
        # Delete the previous generation of what this job just saved, now,
        # rather than when the slowest job finishes. See "Rust caches".
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEY: ${{ steps.target-cache.outputs.cache-primary-key }}
        run: bash scripts/ci_prune_caches.sh "${KEY##*-}" "${KEY%-*}"

  ui-test-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      # `gh cache delete` in the prune step, which runs on main only.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ui
          # No env cache: the ui env installs in 5s and restores in 4s.
          # See the lint job.
          cache: false
      - name: Restore cargo home
        id: home-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          # Registry index + downloads and git checkouts are fully determined by
          # Cargo.lock, so key on it alone. Restore-only: the one job per OS that
          # fetches every crate saves it, and the prefix fallback is for pull
          # requests only. See "Rust caches" above prune-caches.
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-home-', runner.os) || '' }}
      - name: Restore Rust target
        id: target-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target
            !target/**/incremental/**
          # Content-addressed on the lockfile *and* the manifests -- see "Rust
          # caches" above prune-caches for why the manifests belong in it. It
          # hits outright whenever neither has moved, and the Save step below
          # then leaves the existing entry alone. The prefix fallback warms a
          # pull request whose key has moved; main does without it, so each
          # generation it saves holds only what that key builds.
          key: ${{ runner.os }}-cargo-ui-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-ui-target-', runner.os) || '' }}

      - name: Report UI environment
        shell: powershell
        run: .\scripts\ci_windows_ui_snapshot.ps1 -Phase before-tests

      - name: UI tests
        run: pixi run -e ui ui-test

      - name: Report UI environment after tests
        if: always()
        shell: powershell
        run: .\scripts\ci_windows_ui_snapshot.ps1 -Phase after-tests

      - name: Save Rust target
        # Main only, and only a new generation (the cache-hit guard): a PR's
        # entry is scoped to its merge ref, where nothing else can restore it.
        # The key is the one the restore step computed, not a fresh
        # hashFiles, so what is saved is always what was asked for.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            target
            !target/**/incremental/**
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

      - name: Prune superseded Rust caches
        # Delete the previous generation of what this job just saved, now,
        # rather than when the slowest job finishes. See "Rust caches".
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEY: ${{ steps.target-cache.outputs.cache-primary-key }}
        run: bash scripts/ci_prune_caches.sh "${KEY##*-}" "${KEY%-*}"

  # macOS accessibility UI tests. Same xa11y-driven suite as the
  # ui-test-windows job, but macOS gates the AX API behind a TCC grant
  # (kTCCServiceAccessibility) that must target the *exact* on-disk binary.
  # The cargo test binary's path is content-hashed, so we build it first,
  # resolve that path, grant TCC to it, then execute it directly — running it
  # back through `cargo test` could rebuild and move the hash out from under
  # the grant.
  ui-test-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
      # `gh cache delete` in the prune step, which runs on main only.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ui
          # No env cache: the ui env installs in 3s and restores in 4s.
          # See the lint job.
          cache: false
      - name: Restore cargo home
        id: home-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          # Registry index + downloads and git checkouts are fully determined by
          # Cargo.lock, so key on it alone. Restore-only: the one job per OS that
          # fetches every crate saves it, and the prefix fallback is for pull
          # requests only. See "Rust caches" above prune-caches.
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-home-', runner.os) || '' }}
      - name: Restore Rust target
        id: target-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target
            !target/**/incremental/**
          # Content-addressed on the lockfile *and* the manifests -- see "Rust
          # caches" above prune-caches for why the manifests belong in it. It
          # hits outright whenever neither has moved, and the Save step below
          # then leaves the existing entry alone. The prefix fallback warms a
          # pull request whose key has moved; main does without it, so each
          # generation it saves holds only what that key builds.
          key: ${{ runner.os }}-cargo-ui-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-ui-target-', runner.os) || '' }}

      # Compile the test binary (and the sfm-explorer bin it launches) without
      # running, then resolve the test binary's hashed path from cargo's JSON
      # stream. `fromjson?` skips any non-JSON lines pixi may interleave.
      # `--features ui-tests` because `ui_basic` is gated behind it; without the
      # flag cargo would build no such target and `jq` would resolve nothing.
      - name: Build UI test binary
        id: build
        run: |
          set -euo pipefail
          bin=$(pixi run -e ui cargo test -p sfm-explorer --features ui-tests --test ui_basic --no-run --message-format=json \
            | jq -rR 'fromjson? | select(.reason == "compiler-artifact" and .target.name == "ui_basic") | .executable // empty' \
            | tail -n1)
          test -x "$bin"
          echo "Resolved UI test binary: $bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # Grant the Accessibility (TCC) permission to that exact binary so it can
      # read sfm-explorer's accessibility tree via AXUIElement.
      - name: Grant accessibility permission
        uses: xa11y/setup-a11y@v1
        with:
          macos-tcc-client: ${{ steps.build.outputs.bin }}

      # `--nocapture` for the same reason the `ui-test` task in pixi.toml
      # passes it: libtest discards a passing test's stdout, and the suite's
      # own `UIPROBE` cost lines are wanted on green runs above all.
      - name: UI tests
        run: "${{ steps.build.outputs.bin }} --test-threads=1 --nocapture"

      - name: Save Rust target
        # Main only, and only a new generation (the cache-hit guard): a PR's
        # entry is scoped to its merge ref, where nothing else can restore it.
        # The key is the one the restore step computed, not a fresh
        # hashFiles, so what is saved is always what was asked for.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            target
            !target/**/incremental/**
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

      - name: Prune superseded Rust caches
        # Delete the previous generation of what this job just saved, now,
        # rather than when the slowest job finishes. See "Rust caches".
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEY: ${{ steps.target-cache.outputs.cache-primary-key }}
        run: bash scripts/ci_prune_caches.sh "${KEY##*-}" "${KEY%-*}"

  # Linux accessibility UI tests. The same xa11y-driven suite as the Windows
  # and macOS jobs, but Linux is where the accessibility API has to be *stood
  # up* rather than merely used: AT-SPI2 is a pair of D-Bus services, and a
  # bare runner has neither them, nor a session bus to put them on, nor a
  # display to open a window on. setup-a11y installs and starts all of that.
  # `setup-window-manager` is off by default and turned on here as insurance
  # rather than a proven need: the action's docs flag egui/AccessKit as a
  # toolkit whose tree can depend on a window being mapped and activated, but
  # this viewer publishes its whole tree under a bare Xvfb and the suite passes
  # without a WM. Starting fluxbox costs a second, so it stays on.
  #
  # `mesa-vulkan-drivers` is ours to add rather than the action's: the viewer's
  # wgpu build carries only the Vulkan backend on Linux (see sfm-explorer's
  # Cargo.toml), so with the loader present but no ICD behind it every launch
  # panics on `Failed to create wgpu surface` before there is a window to read
  # a tree from. lavapipe, which this package carries, renders the suite fine.
  ui-test-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh cache delete` in the prune step, which runs on main only.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ui
          # No env cache: the ui env installs in 4s and restores in 8s.
          # See the lint job.
          cache: false
      - name: Restore cargo home
        id: home-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          # Registry index + downloads and git checkouts are fully determined by
          # Cargo.lock, so key on it alone. Restore-only: the one job per OS that
          # fetches every crate saves it, and the prefix fallback is for pull
          # requests only. See "Rust caches" above prune-caches.
          key: ${{ runner.os }}-cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-home-', runner.os) || '' }}
      - name: Restore Rust target
        id: target-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target
            !target/**/incremental/**
          # Content-addressed on the lockfile *and* the manifests -- see "Rust
          # caches" above prune-caches for why the manifests belong in it. It
          # hits outright whenever neither has moved, and the Save step below
          # then leaves the existing entry alone. The prefix fallback warms a
          # pull request whose key has moved; main does without it, so each
          # generation it saves holds only what that key builds.
          key: ${{ runner.os }}-cargo-ui-target-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('{0}-cargo-ui-target-', runner.os) || '' }}

      - name: Set up accessibility environment
        uses: xa11y/setup-a11y@v1
        with:
          setup-window-manager: true
          extra-packages: mesa-vulkan-drivers

      # DISPLAY, the session bus and the AT-SPI daemons are live in the job env
      # by now, so the `scripts/a11y_env.sh` wrapper the Linux `ui-test` task
      # goes through finds everything already running and is a passthrough.
      - name: UI tests
        run: pixi run -e ui ui-test

      - name: Save Rust target
        # Main only, and only a new generation (the cache-hit guard): a PR's
        # entry is scoped to its merge ref, where nothing else can restore it.
        # The key is the one the restore step computed, not a fresh
        # hashFiles, so what is saved is always what was asked for.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            target
            !target/**/incremental/**
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

      - name: Prune superseded Rust caches
        # Delete the previous generation of what this job just saved, now,
        # rather than when the slowest job finishes. See "Rust caches".
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEY: ${{ steps.target-cache.outputs.cache-primary-key }}
        run: bash scripts/ci_prune_caches.sh "${KEY##*-}" "${KEY%-*}"

  # Rust caches. Every job restores a cargo home (`<OS>-cargo-home-<gen>`) and,
  # except msrv, a target dir (`<OS>-cargo-<job>-target-<gen>`) -- one
  # *generation* per key. Only main saves, and only when its exact key missed,
  # so a generation is written once and PRs restore main's copy (a PR's own
  # entry would be scoped to its merge ref, where nothing else can read it). The
  # cargo home is saved by the one job per OS that fetches every crate: lint on
  # Linux, test-os-rust elsewhere.
  #
  # The two kinds of cache are keyed on deliberately *different* things.
  #
  # A cargo home holds the registry index, crate downloads and git checkouts.
  # That set is genuinely a pure function of Cargo.lock, so it is keyed on
  # `hashFiles('Cargo.lock')` alone.
  #
  # A target dir is not. It holds compiled artifacts, and which artifacts those
  # are depends on *feature resolution* and on which targets exist -- both of
  # which are declared in the manifests, not the lockfile. So the target keys
  # are `hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml')`.
  #
  # PR #518 is what that sentence costs when it is not true. It gated
  # sfm-explorer's `ui_basic` behind a feature and collapsed two `cargo test`
  # invocations into one, changing no dependency and so not touching Cargo.lock.
  # The restore was an *exact* hit on an entry built under the old resolution,
  # and cargo rebuilt the whole wgpu/egui/accesskit/windows stack against it:
  # 13m13s, against 11m17s for the two invocations it replaced. That alone would
  # be a one-time transition cost, but the save guard is
  # `cache-hit != 'true'`, so main would have skipped the save, kept the
  # poisoned entry, and paid the rebuild on every run until some unrelated
  # change happened to bump Cargo.lock.
  #
  # The patterns are enumerated rather than written `**/Cargo.toml`, for two
  # reasons that both end in a silently wrong hash. `lint` and the three
  # `ui-test-*` jobs run setup-pixi *before* their restore steps, so `.pixi/` is
  # in the workspace when their keys are computed while the other jobs' keys are
  # computed without it; and the prune-caches job below sparse-checks out only
  # what it needs, so a pattern matching files it does not fetch would give it a
  # KEEP_HASH matching nothing any job ever wrote -- which reads as "no current
  # generation for this prefix" and silently prunes nothing, for ever. Adding a
  # manifest to the workspace means adding it to prune-caches' sparse-checkout
  # too; `crates/*/Cargo.toml` already covers every workspace member.
  #
  # Everything hashed here is pinned to LF in .gitattributes and must stay that
  # way. Windows runners default to core.autocrlf=true, so without the pin they
  # compute a different generation from Linux and macOS for the same commit --
  # measured on this PR before the pin was extended: Windows b0986aa1… against
  # bc4759dc… on both others. prune-caches runs on ubuntu-latest and prunes with
  # the one hash it computes, so every Windows target cache would have read as
  # "no current-generation entry for this prefix" and never been pruned,
  # accumulating ~1.3 GB per generation against the 10 GB budget. Cargo.lock was
  # already pinned for exactly this reason; putting the manifests in the key is
  # what put Cargo.toml beside it.
  #
  # GitHub's 10 GB per-repo budget is the constraint, and the LRU eviction it
  # triggers picks victims by last access, not by whether anything still wants
  # them -- so staying under it has to be CI's job. Three rules do that:
  #
  #   * Main restores the exact key or nothing. A prefix fallback on main
  #     carried the previous generation's artifacts into the next save, so each
  #     dependency bump made the entries bigger: Windows-cargo-test-target went
  #     1.9 -> 3.0 -> 4.3 -> 4.6 GB over four lockfile moves, while a fresh
  #     build of macOS-cargo-test-target is 1.2 GB. PRs keep the fallback: they
  #     never save, so their warm start costs the budget nothing, and it is what
  #     keeps a lockfile-bumping PR from compiling cold.
  #   * Each job prunes the previous generation of what it saved right after
  #     saving it. With one prune at the end of the run, both generations sat
  #     side by side for as long as the slowest Windows job took (~40 min), and
  #     two generations have never fit: LRU ate the new Linux entries or the
  #     old Windows ones instead.
  #   * This job then sweeps every cargo prefix once more, for anything a
  #     job's own prune missed (it failed, or the job stopped before it).
  #
  # scripts/ci_prune_caches.sh holds the rules for what may be deleted: an old
  # entry goes only once its prefix has an entry at this run's lockfile hash (so
  # a failed or skipped save leaves the old generation as the PR fallback), and
  # never when it is newer than that replacement.
  prune-caches:
    needs:
      [
        lint,
        test-linux,
        test-os-rust,
        test-os-python,
        ui-test-windows,
        ui-test-macos,
        ui-test-linux,
      ]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # `gh cache delete` needs this; the workflow default is `contents: read`.
      actions: write
    steps:
      # `hashFiles` reads the workspace, so everything either generation is
      # keyed on has to be on disk -- the manifests as well as the lockfile,
      # or this job's idea of the current generation would not be any job's.
      # The script is the only other thing it reads. A new workspace member
      # needs its manifest added here too.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Cargo.lock
            Cargo.toml
            crates/*/Cargo.toml
            scripts/ci_prune_caches.sh
          sparse-checkout-cone-mode: false
      # Two invocations because the target caches and the cargo homes are keyed
      # on different generations (see "Rust caches" above), and the script takes
      # one KEEP_HASH per call. The first sweeps every `*-cargo-*` prefix at the
      # target generation; a cargo home has no entry at that hash, so the
      # script's "no current-generation entry for this prefix" guard leaves them
      # alone rather than deleting them, and the second call then prunes them at
      # their own. Order matters only in that neither can run without the other.
      - name: Delete superseded cargo target caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci_prune_caches.sh "${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}"
      - name: Delete superseded cargo home caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci_prune_caches.sh "${{ hashFiles('Cargo.lock') }}" Linux-cargo-home Windows-cargo-home macOS-cargo-home

  # Single stable check to mark as required in branch protection. Always runs
  # and reports a status, so docs-only PRs (which skip lint/test) aren't blocked.
  ci-ok:
    needs:
      [
        changes,
        lint,
        msrv,
        test-linux,
        test-os-rust,
        test-os-python,
        ui-test-windows,
        ui-test-macos,
        ui-test-linux,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "CI passed"

name: Publish to PyPI

# A published GitHub release uploads to PyPI. A manual run builds the same
# files and uploads them to TestPyPI instead, to check the whole workflow,
# upload included, before tagging a release. TestPyPI refuses a file that is
# already there, so a manual run only uploads a version TestPyPI does not have.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          args: --release --out dist --interpreter python3.14

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux
          path: dist/*.whl

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-py${{ matrix.python-version }}
          path: dist/*.whl

  # Apple silicon only: `macos-latest` is an arm64 runner, it is the platform
  # the `test-os-python` CI job tests on, and it is the only macOS platform
  # pixi.toml supports. Intel Macs build from the sdist.
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-py${{ matrix.python-version }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build-linux, build-windows, build-macos, build-sdist]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          attestations: true

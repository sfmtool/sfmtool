# Cargo configuration for CI only. Every job in .github/workflows/ci.yml that
# runs cargo copies this file to ~/.cargo/config.toml before its first cargo
# command, and every target cache key hashes it. See "CI cargo config" at the
# top of ci.yml for why it exists and what it saves.
#
# The profiles in the root Cargo.toml still apply to every other crate:
# workspace crates at opt-level 1 and dependencies at 3.

[profile.dev.package.sfm-explorer]
opt-level = 0
